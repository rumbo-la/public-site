# Shared build used by CI and both deploy workflows, so every environment ships the same checks.
# Syncs positions from Notion (npm "pregenerate"), lints, typechecks and generates the static site,
# then uploads .output/public as the "site" artifact.
name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the build never pushes; keep the token out of .git
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run generate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: .output/public
          include-hidden-files: true # keeps .htaccess
          retention-days: 7
