# Beta (beta.rumbo.la on GitHub Pages): every push to a feature branch.
# GitHub flow: feat/** → beta for review, pull request → CI, merge to main → production.
name: Deploy beta

on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

permissions:
  contents: read

# Pages hosts one site, so the latest feature push wins; older runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Manual runs are only allowed from feature branches too.
    if: startsWith(github.ref, 'refs/heads/feat/')
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
