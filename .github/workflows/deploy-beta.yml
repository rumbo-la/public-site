# Beta (beta.rumbo.la on GitHub Pages): every push to a feature branch.
# GitHub flow: feat/** → beta for review, pull request → CI, merge to main → production.
name: Deploy beta

on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

permissions:
  contents: read

# Pages hosts one site, so the latest feature push wins; older runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Manual runs are only allowed from feature branches too.
    if: startsWith(github.ref, 'refs/heads/feat/')
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
